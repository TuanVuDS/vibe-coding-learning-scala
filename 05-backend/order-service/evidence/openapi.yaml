openapi: 3.1.0
info:
  title: Users and Orders API
  version: 1.0.0
paths:
  /api/v1/users:
    get:
      operationId: listUsers
      parameters:
      - name: q
        in: query
        description: Chứa trong name hoặc email; không phân biệt hoa thường
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: id, name, email; '-' cho giảm dần; id là khóa phụ
        required: false
        schema:
          default: id
          type: string
      - name: offset
        in: query
        description: 0..1000000; số dòng bỏ qua
        required: false
        schema:
          default: 0
          type: integer
          format: int32
      - name: limit
        in: query
        description: 1..100; số dòng tối đa
        required: false
        schema:
          default: 20
          type: integer
          format: int32
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersPage'
        '400':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '201':
          description: ''
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        '400':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/{userId}:
    get:
      operationId: getUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        '400':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/{userId}/orders:
    get:
      operationId: listOrders
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: 0..1000000; số dòng bỏ qua
        required: false
        schema:
          default: 0
          type: integer
          format: int32
      - name: limit
        in: query
        description: 1..100; số dòng tối đa
        required: false
        schema:
          default: 20
          type: integer
          format: int32
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersPage'
        '400':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createOrder
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
        required: true
      responses:
        '201':
          description: ''
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderView'
        '400':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderView'
        '400':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/orders/{orderId}/status:
    patch:
      operationId: updateStatus
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderView'
        '400':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: ''
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    CreateOrderRequest:
      title: CreateOrderRequest
      type: object
      required:
      - totalMinor
      properties:
        totalMinor:
          type: integer
          format: int64
    CreateUserRequest:
      title: CreateUserRequest
      type: object
      required:
      - name
      - email
      properties:
        name:
          type: string
        email:
          type: string
    OrderStatus:
      title: OrderStatus
      type: string
      enum:
      - Cancelled
      - Paid
      - Pending
      - Shipped
    OrderView:
      title: OrderView
      type: object
      required:
      - id
      - userId
      - totalMinor
      - currency
      - status
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        totalMinor:
          type: integer
          format: int64
        currency:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
    OrdersPage:
      title: OrdersPage
      type: object
      required:
      - total
      - offset
      - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderView'
        total:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
    Problem:
      title: Problem
      type: object
      required:
      - type
      - title
      - status
      - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        errors:
          type: array
          items:
            type: string
    StatusRequest:
      title: StatusRequest
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
    UserView:
      title: UserView
      type: object
      required:
      - id
      - name
      - email
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
    UsersPage:
      title: UsersPage
      type: object
      required:
      - total
      - offset
      - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserView'
        total:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
