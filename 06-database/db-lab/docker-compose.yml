# PostgreSQL 18 cho chạy tay (DbDemo, psql). Test KHÔNG cần file này: test dùng PostgreSQL nhúng.
#   docker compose up -d
#   docker compose exec db psql -U scalaeng -d scalaeng
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: scalaeng
      POSTGRES_PASSWORD: scalaeng   # chỉ dùng cho máy học tập; production đọc từ secret manager (Chương 17)
      POSTGRES_DB: scalaeng
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalaeng -d scalaeng"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
